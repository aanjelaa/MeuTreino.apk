name: Gerar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk MeuTreino.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeuTreino-apk
          path: MeuTreino.apk
      - name: Publicar APK para download direto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima MeuTreino.apk --title "Meu Treino (última versão)" --notes "Baixe o MeuTreino.apk abaixo e instale no celular."

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'br.com.meutreino'
    compileSdk 34
    defaultConfig {
        applicationId "br.com.meutreino"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "2.0"
    }
    // Chave fixa: assim as atualizações instalam por cima sem apagar os dados.
    signingConfigs {
        fixa {
            storeFile file('meutreino.keystore')
            storePassword System.getenv('KS_SENHA') ?: ''
            keyAlias 'meutreino'
            keyPassword System.getenv('KS_SENHA') ?: ''
        }
    }
    buildTypes {
        debug { if (file('meutreino.keystore').exists()) signingConfig signingConfigs.fixa }
        release { minifyEnabled false; if (file('meutreino.keystore').exists()) signingConfig signingConfigs.fixa }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
